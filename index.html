#suggest .sug .code{color:var(--mut);font-size:12px;width:84px}
#suggest .sug .name{font-weight:600;font-size:13px}
#suggest .sug .sect{font-size:11px;color:var(--cy);margin-left:auto}
#suggest .sug .badge{font-size:10px;color:#0b0d10;background:var(--cy);padding:1px 6px;border-radius:8px;font-weight:600}
#suggest .sug .sug-sub{display:flex;gap:12px;margin-top:3px;font-size:11px;color:var(--mut)}
#suggest .sug .sug-sub .up{color:#ff5d5d;font-weight:600}

.ladder td.up{color:var(--good);font-weight:600}

/* ---------------- 2. 生成确定性近60交易日K线（演示模式，结束于今日） ---------------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function lastTradingDays(n){
  const out=[]; let d=new Date(2026,8,14); // 截止今日 2026-09-14
  while(out.length<n){ if(d.getDay()!==0&&d.getDay()!==6) out.push(new Date(d)); d=new Date(d.getTime()-864e5); }
  return out.reverse();
}
function genKline(code, price, drift, n=62){
  const rnd=mulberry32([...code].reduce((a,c)=>a*131+c.charCodeAt(0),7)>>>0);
  const days=lastTradingDays(n); let p=price*0.72; const out=[];
  for(let i=0;i<n;i++){
    const meanPull=(price/p-1)*0.12;            // 温和向目标价回归
    const ch=(rnd()-0.5)*2.2+drift*0.5+meanPull*100;
    p=Math.max(2,p*(1+ch/100));
    const o=p*(1+(rnd()-0.5)*0.6/100);
    const c=p*(1+(rnd()-0.5)*1.5/100);
    const hi=Math.max(o,c)*(1+rnd()*1.1/100);
    const lo=Math.min(o,c)*(1-rnd()*1.1/100);
    const vol=(0.6+rnd()*1.6)*(1+Math.abs(ch)*0.5);
    out.push({d:fmt(days[i]),o:r(o),c:r(c),h:r(hi),l:r(lo),v:r(vol)});
  }
  const last=out[out.length-1], prev=out[out.length-2];
  out[out.length-1]={...last, c:price, h:Math.max(last.h,price,last.o), l:Math.min(last.l,price*0.97,last.o),
    o:Math.round((last.o + prev.c)/2*100)/100};
  return out;
}
function fmt(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function r(x){return Math.round(x*100)/100}

/* ---------------- 3. 技术指标引擎 ---------------- */
function ma(arr,n,i){if(i+1<n)return null;let s=0;for(let k=0;k<n;k++)s+=arr[i-k];return s/n}
function rsi(closes,n=14){if(closes.length<n+1)return 50;let g=0,l=0;for(let i=closes.length-n;i<closes.length;i++){const d=closes[i]-closes[i-1];if(d>=0)g+=d;else l-=d}if(g+l===0)return 50;return 100*g/(g+l)}
function ema(arr,n){const k=2/(n+1);let e=arr[0];const out=[e];for(let i=1;i<arr.length;i++){e=arr[i]*k+e*(1-k);out.push(e)}return out}
function macd(closes){const e12=ema(closes,12),e26=ema(closes,26),dif=[];for(let i=0;i<closes.length;i++)dif.push(e12[i]-e26[i]);const dea=ema(dif,9);const hist=dif.map((x,i)=>2*(x-dea[i]));return{dif,dea,hist}}
function kdj(k){const n=9;const K=[],D=[],J=[];let kk=50,dd=50;for(let i=0;i<k.length;i++){const s=k.slice(Math.max(0,i-n+1),i+1);const ll=Math.min(...s.map(x=>x.l));const hh=Math.max(...s.map(x=>x.h));const rsv=hh===ll?50:(k[i].c-ll)/(hh-ll)*100;kk=kk*2/3+rsv/3;dd=dd*2/3+kk/3;K.push(kk);D.push(dd);J.push(3*kk-2*dd)}return{K,D,J}}

/* 计算各维度评分 → 返回对象 */
function computeScore(S,k){
  const closes=k.map(x=>x.c), vols=k.map(x=>x.v);
  const n=closes.length;
  const ma5=ma(closes,5,n-1),ma10=ma(closes,10,n-1),ma20=ma(closes,20,n-1);
  const price=closes[n-1];
  const rs=rsi(closes), mk=macd(closes), kd=kdj(k);
  const kk=kd.K[n-1],jj=kd.J[n-1];
  // 5日10日20日均线
  const hist=mk.hist;
  const macdBull=hist[n-1]>hist[n-2]?10:0;
  const goldCross=(hist[n-2]<=0&&hist[n-1]>0)?0.25:(mk.dif[n-1]>mk.dea[n-1]?0.15:0);
  // ---- 技术面 ----
  let tech=0;
  if(price>=ma5)tech+=25; else tech+=6;
  if(price>=ma10)tech+=20; else tech+=4;
  if(price>=ma20)tech+=20; else tech+=4;
  if(ma5>=ma10)tech+=15; else tech+=5;
  if(ma10>=ma20)tech+=15; else tech+=5;
  tech+=macdBull; tech+=goldCross*100;
  tech+= rs>70||rs<30 ? 0 : (rs>=45&&rs<=65?6:3);
  tech=Math.min(100,tech);
  // ---- 资金面 ----
  const f=S.flow;
  const fScore=100*Math.max(0,Math.min(1,(f.main/10+0.5)/1.4));
  let fundMoney=fScore*0.75+(f.superLarge>0?15:3)+(f.north>0?8:2)+((S.hotMoney&&S.hotMoney.active)?4:1);
  fundMoney=Math.min(100,fundMoney);
  // ---- 筹码面 ----
  const chipScore=Math.min(100, Math.max(20, 40 + (S.chips.profitRatio-50) ) );
  const chipsScore=chipScore*0.7 + (S.chips.concentration.includes("集中")?20: (S.chips.concentration.includes("分散")?8:14));
  // ---- 板块题材 ----
  let sec=0;
  if(S.isCore)sec+=34;else sec+=12;
  if(S.isLeader)sec+=30;else sec+=10;
  sec+= S.leaderRank.includes("龙头")?16: (S.isLeader?10:4);
  sec+= S.themes.length>=3?16:10;
  sec+= S.boardCount>=2?6:2;
  sec=Math.min(100,sec);
  // ---- 消息面 ----
  let plan=0,pneg=0; let hasCore=false;
  S.news.forEach(x=>{if(x.type==="利好")plan+=x.imp*(x.core?2:1);if(x.type==="利空")pneg+=x.imp*(x.core?2:1);if(x.core&&x.type==="利好")hasCore=true});
  const coreNews=hasCore?18:(S.news.some(x=>x.core)?6:0) + (S.news.some(x=>x.core&&x.type==="利好")?0:0);
  let msg=0; msg+=Math.min(40,plan*8); msg+=coreNews; msg-=pneg*6;
  msg=Math.max(8,Math.min(100,msg));
  // ---- 基本面 ----
  const pe=S.pe;
  let peScore; if(pe<=0)peScore=30; else if(pe<25)peScore=85; else if(pe<40)peScore=70; else if(pe<60)peScore=55; else if(pe<90)peScore=40; else peScore=25;
  const grow=S.rev["全年增速"]||"0%"; const g=parseFloat(grow)||0;
  const gScore= Math.max(0,40+ (g<0?-20: g>60?20:Math.min(g,60)));
  const bFund=pe*0.55 + gScore*0.45;
  const fundScore=Math.min(100,Math.max(15,bFund));
  // ---- K线买点 ----
  const lastV=vols[n-1], avgV10=vols.slice(-10).reduce((a,b)=>a+b,0)/10;
  const volRatio=lastV/avgV10;
  let bp=0;
  if(price>=ma5&&price>=ma10&&ma5>=ma10)bp+=30; else bp+=10;
  if(ma10>=ma20)bp+=20; else bp+=6;
  if(macdBull>0&&mk.dif[n-1]>mk.dea[n-1])bp+=20;else bp+=6;
  if(kk>=20&&kk<=80&&jj>-10)bp+=15;else bp+=5;
  if(volRatio>1.3)bp+=10; else if(volRatio<0.7)bp+=2; else bp+=6;
  bp=Math.min(100,bp);
  // ---- 打板评分（专业模型：市值适配 / 连板高度 / 主题强度 / 催化 / 资金 / 量能 / 监管）----
  const bd=boardScore(S,{sec,fund:fundMoney,hasCore,volRatio});
  const bands=bd.bands;
  // ---- 监管期分数(权重) ----
  const mon=monitScore(S.monitor);
  // 综合
  let total=tech*0.18 + fundMoney*0.16 + chipsScore*0.08 + sec*0.16 + msg*0.13 + fundScore*0.06 + bp*0.11 + bands*0.12;
  // 监管期惩罚
  if(S.monitor.state==="异动监控")total-=6;
  total=Math.max(3,Math.round(total));
  return {tech:Math.round(tech), fund:Math.round(fundMoney), chips:Math.round(chipsScore), sec:Math.round(sec), msg:Math.round(msg),
    basic:Math.round(fundScore), bp:Math.round(bp), bands:Math.round(bands), bd, total,
    techDetail:{ma5,ma10,ma20,rs,mk:{dif:mk.dif[n-1],dea:mk.dea[n-1],hist:hist[n-1]},kd:{K:kk,D:kd.D[n-1],J:jj},volRatio},
    grade:gradeOf(total), mon};
}
/* 打板专项模型
   市值适配：>300亿基本不适合拉板；~20-150亿(几十亿~100多亿)最佳，易拉升易连板
   连板高度：1-2板低位承接最佳，3板中高位，4板+高位风险放大 */
function capFitScore(cap){
  if(cap<=0)return 30;
  if(cap<=20)return 40;
  if(cap<60)return 90;
  if(cap<=150)return 100;
  if(cap<=300)return 40;
  return 6;
}
function chainEmotionScore(chain){
  if(chain>=5)return 22;
  if(chain===4)return 44;
  if(chain===3)return 66;
  if(chain===2)return 84;
  if(chain===1)return 86;
  return 28;
}
function volEmotionScore(vr){ if(vr>=1.8)return 82; if(vr>=1.2)return 60; if(vr>=0.8)return 45; return 30; }
function boardScore(S,ctx){
  const cap=capFitScore(S.mktcap);
  const chainE=chainEmotionScore(S.chain||0);
  const volE=volEmotionScore(ctx.volRatio);
  const msgCat = ctx.hasCore?90 : (S.news.some(x=>x.core)?60:30);
  const mon=S.monitor.state;
  let bands=Math.round(cap*0.28+chainE*0.22+Math.min(ctx.sec,100)*0.15+msgCat*0.07+ctx.fund*0.16+volE*0.12);
  if(mon==="异动监控")bands-=14; else if(mon==="提示")bands-=4;
  bands=Math.max(5,Math.min(100,bands));
  let capTxt;
  if(S.mktcap>300)capTxt="市值"+S.mktcap+"亿（>300亿）大市值，拉升难度大、难连板，基本不适合打板，更适合波段/趋势";
  else if(S.mktcap>150)capTxt="市值"+S.mktcap+"亿（150~300亿）可小仓打板，但封板与连板概率一般";
  else if(S.mktcap>60)capTxt="市值"+S.mktcap+"亿处于最佳打板区间，易拉升、易连板，适配度高";
  else if(S.mktcap>20)capTxt="市值"+S.mktcap+"亿为标准打板小票，盘子轻、弹性好";
  else capTxt="市值仅"+S.mktcap+"亿，盘子过小、流动性偏差，慎重打板";
  return {bands,cap,chainE,volE,msgCat,capTxt};
}

/* 非内置标的：补抓真实市值/市盈率/价格，避免默认 50亿 放大打板分 */
function backfillShell(S,code){
  return fetchQuote(code).then(q=>{
    if(isFinite(q.mktcap)&&q.mktcap>0)S.mktcap=q.mktcap;
    if(isFinite(q.pe))S.pe=q.pe;
    if(isFinite(q.price)&&q.price>0)S.price=q.price;
    if(isFinite(q.turnover))S.turnover=q.turnover;
    if(q.name)S.name=q.name;
    S.buyZone={price:+S.price.toFixed(2),lo:+(S.price*0.97).toFixed(2),hi:+(S.price*1.03).toFixed(2)};
    const k=genKline(S.code,S.price,0);
    render(S,k,[`已补抓真实行情 · ${S.name}(${code})，市值${S.mktcap.toFixed(0)}亿，PE ${S.pe}`]);
  }).catch(()=>{});
}
/* 构建分析并渲染 */
function analyze(code){
  STATE.cur=code;
  let S=DEMOS[code];
  if(!S){S=makeShell(code); const k0=genKline(S.code,S.price,0); render(S,k0,[`${S.name}(${code}) 为全市场标的，暂无内置题材精析，已按通用模型输出并补抓真实市值…`]); backfillShell(S,code); return }
  let k=genKline(S.code,S.price,0);
  if(STATE.mode==="live"){ doLive(S,code); return }
  render(S,k);
}
async function doLive(S,code){
  document.getElementById("result").innerHTML=`<div class="sec" style="text-align:center;padding:40px">
    <span class="lds"></span> &nbsp;正在抓取 <b>${S.name}</b>(${code}) 实时行情与日K数据…</div>`;
  try{
    const k=await fetchKline(code);
    const q=await fetchQuote(code);
    const okK=Array.isArray(k)&&k.length>20;
    const okQ=q&&Number.isFinite(q.price);
    if(okK&&okQ){S.price=q.price;S.changePct=Number.isFinite(q.chg)?q.chg:S.changePct;S.pe=Number.isFinite(q.pe)?q.pe:S.pe;S.mktcap=Number.isFinite(q.mktcap)?q.mktcap:S.mktcap;S.turnover=Number.isFinite(q.turnover)?q.turnover:S.turnover;
      S.buyZone={price:+q.price.toFixed(2),lo:+(q.price*0.97).toFixed(2),hi:+(q.price*1.03).toFixed(2)};
      render(S,k,[`实时行情更新成功 · ${q.name}(${code})`]);}
    else{render(S,genKline(code,S.price,0),["实时接口未返回完整数据，已回退内置演示数据"])}
  }catch(e){
    render(S,genKline(code,S.price,0),["实时接口暂不可用，已回退内置演示数据（可联网重试）"]);
  }
}
/* 东方财富 Jsonp 实时K线 */
function fetchKline(code){
  return new Promise((ok,no)=>{
    const secid=market(code)+"."+code;
    const cb="cb_"+Date.now();
    const url=`https://push2his.eastmoney.com/api/qt/stock/kline/get?secid=${secid}&fields1=f1,f2,f3&fields2=f51,f52,f53,f54,f55,f56&klt=101&fqt=1&beg=0&end=20500101&cb=${cb}`;
    window[cb]=function(d){
      try{const kl=d.data.klines||[];const arr=kl.map(s=>{const p=s.split(",");return{d:p[0],o:+p[1],c:+p[2],h:+p[3],l:+p[4],v:+p[5]}});ok(arr)}
      catch(e){no(e)};
      try{delete window[cb]}catch{}
    };
    const sc=document.createElement("script");sc.src=url;sc.onerror=()=>{try{delete window[cb]}catch{};no(new Error("k err"))};
    document.body.appendChild(sc);setTimeout(()=>{try{delete window[cb]}catch{};no(new Error("timeout"))},8000);
  });
}
function market(code){return /^(60|68|51|56|58|9)/.test(code)?"1":"0"}
function fetchQuote(code){
  return new Promise((ok,no)=>{
    const secid=market(code)+"."+code;
    const cb="cq_"+Date.now();
    const url=`https://push2.eastmoney.com/api/qt/stock/get?secid=${secid}&fields=f43,f57,f58,f60,f62,f114,f115,f116,f117,f162,f167,f170,f47,f48,f49&cb=${cb}`;
    window[cb]=function(d){
      try{const x=d.data;ok({name:x.f58,price:x.f43/100,chg:x.f170/100,pe:x.f162,	mktcap:x.f116/1e8,turnover:x.f168/100})}
      catch(e){no(e)};try{delete window[cb]}catch{}
    };
    const sc=document.createElement("script");sc.src=url;sc.onerror=()=>no(new Error("q err"));
    document.body.appendChild(sc);setTimeout(()=>no(new Error("timeout")),8000);
  });
}

function ladderHTML(l){
  if(!l||(!l.leader&&!(l.tier&&l.tier.length)))return "";
  const row=(x,tag)=>{const u=x.up?1:0;return `<tr><td class="nm">${tag?`<span class="tag lead">${tag}</span>`:""}${x.name}${x.code?`<span class="code">${x.code}</span>`:""}</td><td class="${u?"u":"d"}">${u?"涨停":"未涨停"}</td><td>${x.boards||0}板</td><td class="up">${x.week||"-"}</td></tr>`};
  let rows="";
  if(l.leader)rows+=row(l.leader,"龙头");
  (l.tier||[]).forEach(x=>rows+=row(x,""));
  if(!rows)return "";
  return `<div class="boardcard" style="grid-column:1/-1">
    <div class="k">板块梯队（龙头/涨停/连板/近一周累计） <span style="float:right;font-weight:600;color:var(--mut)">${l.theme?l.theme:""}${l.position?" · "+l.position:""}</span></div>
    <div class="ladder"><table>
      <thead><tr><th>标的 / 角色</th><th>当日涨停</th><th>连板高度</th><th>近一周累计涨幅</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <div class="legend">龙头是否封板、连板高度与近一周累计涨幅，决定本标的能否借板块情绪共振走强；龙头若熄火，跟风标的隔日溢价往往衰减。</div>
  </div>`;
}

/* 图表 */
const charts={};
function mkChart(id,opt){const el=document.getElementById(id);if(!el)return;if(!hasEcharts()){el.innerHTML=`<div style="color:var(--mut2);padding:20px;text-align:center">⚠ 图表库未加载（需联网加载 ECharts）。请联网后刷新。</div>`;return}if(charts[id])charts[id].dispose();charts[id]=echarts.init(el);charts[id].setOption(opt)}
function drawTechno(sc){
  const upd=(a,b)=>`<span style="color:${a>b?"var(--red)":"var(--green)"}">${a>b?"▲":"▼"}${(Math.abs(a-b)).toFixed(2)}</span>`;
  document.getElementById("yield").innerHTML=`<div class="tooltip-bar">指标：RSI=${sc.techDetail.rs?sc.techDetail.rs.toFixed(0):"-"}（>70超买 &lt;30超卖）　MACD(DIF ${sc.techDetail.mk.dif.toFixed(3)} / DEA ${sc.techDetail.mk.dea.toFixed(3)} / 柱 ${sc.techDetail.mk.hist.toFixed(3)} ${sc.techDetail.mk.hist>0?"金叉区":"死叉区"}）　KDJ(J=${sc.techDetail.kd.J.toFixed(0)})　量比 ${sc.techDetail.volRatio.toFixed(2)}</div>`;
}
function drawCharts(S,k){
  const cat=k.map(x=>x.d);
  const clos=k.map(x=>x.c);
  const vols=k.map(x=>x.v);
  const maL=a=>clos.map((_,i)=>ma(clos,a,i));
  const c5=maL(5),c10=maL(10),c20=maL(20);
  mkChart("kchart",{
    backgroundColor:"transparent",
    grid:{left:50,right:16,top:30,bottom:60},
    tooltip:{trigger:"axis",axisPointer:{type:"cross"},backgroundColor:"#171c27",borderColor:"#2a3350",textStyle:{color:"#e7ecf5"}},
    legend:{data:["K线","MA5","MA10","MA20","成交量"],top:0,textStyle:{color:"#8b96ab"}},
    xAxis:{type:"category",data:cat,axisLine:{lineStyle:{color:"#2a3350"}},axisLabel:{color:"#5f6b81"},boundaryGap:true},
    yAxis:[{type:"value",scale:true,splitLine:{lineStyle:{color:"#1b212e"}},axisLabel:{color:"#5f6b81"}},
           {type:"value",splitLine:{show:false},axisLabel:{color:"#5f6b81"}}],
    dataZoom:[{type:"inside"},{type:"slider",height:16,bottom:6}],
    series:[
      {name:"K线",type:"candlestick",data:k.map(x=>[x.o,x.c,x.l,x.h]),itemStyle:{color:"#ff5b5b",color0:"#2fb57f",borderColor:"#ff5b5b",borderColor0:"#2fb57f"}},
      {name:"MA5",type:"line",data:c5,smooth:true,symbol:"none",lineStyle:{width:1.4,color:"#f5b544"}},
      {name:"MA10",type:"line",data:c10,smooth:true,symbol:"none",lineStyle:{width:1.4,color:"#4a7dff"}},
      {name:"MA20",type:"line",data:c20,smooth:true,symbol:"none",lineStyle:{width:1.4,color:"#9b6bff"}},
      {name:"成交量",type:"bar",yAxisIndex:1,data:vols.map((v,i)=>({value:v,itemStyle:{color:k[i].c>=k[i].o?"rgba(255,91,91,.5)":"rgba(47,181,127,.5)"}}))}
    ]
  });
}
function drawFlow(S){
  const labels=["主力净流入","超大单","大单","北向","散户"];
  const vals=[S.flow.main,S.flow.superLarge,S.flow.big||S.flow.main*0.4,S.flow.north||0,S.flow.retail];
  mkChart("flowchart",{
    backgroundColor:"transparent",grid:{left:90,right:40,top:20,bottom:20},
    tooltip:{trigger:"axis",axisPointer:{type:"shadow"},backgroundColor:"#171c27",textStyle:{color:"#e7ecf5"}},
    xAxis:{type:"value",splitLine:{lineStyle:{color:"#1b212e"}},axisLabel:{color:"#5f6b81"}},
    yAxis:{type:"category",data:labels,axisLabel:{color:"#aab4c6"}},
    series:[{type:"bar",data:vals.map(v=>({value:v,itemStyle:{color:v>=0?"#ff5b5b":"#2fb57f",borderRadius:4}})),label:{show:true,position:"right",formatter:p=>p.value+"亿",color:"#aab4c6"}}]
  });
}
function drawChips(S){
  const gain=S.chips.profitRatio;
  const pain=100-gain;
  mkChart("chips",{
    backgroundColor:"transparent",title:{text:"当前筹码获利盘"+gain+"%"+" /"+S.chips.concentration,textStyle:{color:"#8b96ab",fontSize:12},left:10,top:0},
    series:[{type:"pie",radius:["45%","70%"],center:["50%","55%"],label:{color:"#aab4c6"},
      data:[{value:gain,name:"获利盘 "+gain+"%",itemStyle:{color:"#ff5b5b"}},
            {value:pain,name:"套牢盘 "+pain+"%",itemStyle:{color:"#2fb57f"}},
            {value:(S.chips.profitRatio>50?15:10),name:`浮筹集中度 ${S.chips.profitRatio>60?"高":"中"}`}]}],
    legend:{bottom:0,textStyle:{color:"#8b96ab"}}
  });
}
function drawRadar(sc){
  mkChart("radar",{
    backgroundColor:"transparent",
    tooltip:{backgroundColor:"#171c27",textStyle:{color:"#e7ecf5"}},
    radar:{indicator:[{name:"技术",max:100},{name:"资金",max:100},{name:"筹码",max:100},{name:"板块",max:100},{name:"消息",max:100},{name:"基本面",max:100},{name:"买点",max:100},{name:"打板",max:100}],radius:"62%",
      axisName:{color:"#8b96ab"},splitArea:{areaStyle:{color:["rgba(255,255,255,.02)","rgba(255,255,255,.04)"]}},splitLine:{lineStyle:{color:"#2a3350"}}},
    series:[{type:"radar",data:[{value:[sc.tech,sc.fund,sc.chips,sc.sec,sc.msg,sc.basic,sc.bp,sc.bands],
      name:STATE.lastS?STATE.lastS.name:"标的",areaStyle:{color:"rgba(74,125,255,.25)"},lineStyle:{color:"#4a7dff"},itemStyle:{color:"#4a7dff"}}]}]
  });
}

/* tabs */
function setTab(p){
  document.querySelectorAll("#tabs .tab").forEach(t=>t.classList.toggle("active",t.dataset.p===p));
  document.querySelectorAll(".tabpane").forEach(t=>t.classList.toggle("active",t.id==="pane-"+p));
}
